<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wild Frontier</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif;user-select:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;font-size:13px;text-shadow:0 2px 4px #000;pointer-events:none;z-index:10}
#hud div{margin-bottom:3px}
#inv{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.6);padding:8px 12px;
  border-radius:8px;font-size:12px;line-height:1.6;z-index:10}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:12px;color:#aaa;text-shadow:0 2px 4px #000;z-index:10}
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.8);padding:10px 20px;border-radius:20px;font-size:14px;
  opacity:0;transition:.3s;z-index:20}
#toast.on{opacity:1}
#cross{position:fixed;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
  border:2px solid rgba(255,255,255,.6);border-radius:50%;z-index:5}
#cross:before{content:'';position:absolute;top:50%;left:50%;width:2px;height:2px;
  background:#fff;margin:-1px;border-radius:50%}
#menu{position:fixed;inset:0;background:#0a0f1a;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:20px;z-index:100;text-align:center;padding:20px}
#menu h1{font-size:32px;letter-spacing:4px;color:#e6c86a}
#menu p{color:#888;font-size:14px;max-width:400px;line-height:1.6}
#menu button{padding:14px 40px;font-size:16px;background:#3a1a1a;color:#fff;
  border:2px solid #c0392b;border-radius:8px;cursor:pointer}
#menu button:hover{background:#5a2a2a}
#menu.hide{display:none}
#joy{position:fixed;width:110px;height:110px;border:2px solid rgba(255,255,255,.3);
  border-radius:50%;display:none;pointer-events:none;z-index:15;transform:translate(-50%,-50%)}
#joyK{position:absolute;top:50%;left:50%;width:50px;height:50px;background:rgba(255,255,255,.3);
  border-radius:50%;transform:translate(-50%,-50%)}
.tb{position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;z-index:15;cursor:pointer}
.tb:active{background:rgba(200,50,50,.6)}
#btnE{right:15px;bottom:100px}
#btnF{right:15px;bottom:20px}
#btnJ{right:95px;bottom:20px}
</style>
</head>
<body>

<div id="hud">
  <div id="hp">❤️ 100</div>
  <div id="fd">🍖 100</div>
  <div id="wt">💧 100</div>
  <div id="tm">☀️ Day 1</div>
</div>
<div id="inv">
  🪵 <span id="cWood">0</span><br>
  🪨 <span id="cStone">0</span><br>
  🦴 <span id="cBone">0</span><br>
  ⚔️ <span id="cWep">Fists</span>
</div>
<div id="cross"></div>
<div id="toast"></div>
<div id="hint">WASD · Mouse · E gather · F attack · Space jump</div>

<div id="joy"><div id="joyK"></div></div>
<button class="tb" id="btnE">GATHER</button>
<button class="tb" id="btnF">HIT</button>
<button class="tb" id="btnJ">JUMP</button>

<div id="menu">
  <h1>WILD FRONTIER</h1>
  <p>Gather wood and stone. Craft weapons. Survive the night.</p>
  <button id="startBtn">▶ START</button>
  <p style="font-size:12px;color:#666">
    Desktop: WASD move, Mouse look, E gather, F attack, Space jump<br>
    Mobile: Left side joystick, Right side look, buttons on right
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ============= BASIC SETUP =============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 120);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============= LIGHTS =============
const hemi = new THREE.HemisphereLight(0xffffff, 0x334455, 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(50, 100, 50);
scene.add(sun);

// ============= GROUND =============
const groundGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
groundGeo.rotateX(-Math.PI/2);
const groundMat = new THREE.MeshLambertMaterial({color: 0x4a7c3a});
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

// Water
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshLambertMaterial({color: 0x2a6a9a, transparent: true, opacity: 0.8})
);
water.rotation.x = -Math.PI/2;
water.position.y = 0;
scene.add(water);

// ============= WORLD OBJECTS =============
const collectibles = []; // Things you can gather

// Tree
function makeTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.4, 3, 6),
    new THREE.MeshLambertMaterial({color: 0x5a3a1a})
  );
  trunk.position.y = 1.5;
  g.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.8, 3, 7),
    new THREE.MeshLambertMaterial({color: 0x2a6a2a})
  );
  leaves.position.y = 4;
  g.add(leaves);
  g.position.set(x, 0, z);
  g.userData = {type: 'tree', hp: 3};
  scene.add(g);
  collectibles.push(g);
}

// Rock
function makeRock(x, z) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.7, 0),
    new THREE.MeshLambertMaterial({color: 0x888888, flatShading: true})
  );
  rock.position.set(x, 0.5, z);
  rock.userData = {type: 'rock', hp: 3};
  scene.add(rock);
  collectibles.push(rock);
}

// Bone
function makeBone(x, z) {
  const bone = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.15, 0.15),
    new THREE.MeshLambertMaterial({color: 0xe8d8a8})
  );
  bone.position.set(x, 0.2, z);
  bone.rotation.y = Math.random() * 6;
  bone.userData = {type: 'bone', hp: 1};
  scene.add(bone);
  collectibles.push(bone);
}

// Place items
for (let i = 0; i < 40; i++) {
  const x = (Math.random() - 0.5) * 160;
  const z = (Math.random() - 0.5) * 160;
  if (Math.hypot(x, z) < 8) continue;
  makeTree(x, z);
}
for (let i = 0; i < 30; i++) {
  const x = (Math.random() - 0.5) * 160;
  const z = (Math.random() - 0.5) * 160;
  if (Math.hypot(x, z) < 8) continue;
  makeRock(x, z);
}
for (let i = 0; i < 20; i++) {
  const x = (Math.random() - 0.5) * 160;
  const z = (Math.random() - 0.5) * 160;
  if (Math.hypot(x, z) < 8) continue;
  makeBone(x, z);
}

// ============= PLAYER =============
const player = {
  x: 0, y: 1.7, z: 0,
  vy: 0,
  yaw: 0, pitch: 0,
  hp: 100, food: 100, water: 100,
  wood: 0, stone: 0, bone: 0,
  weapon: 'fists',
  onGround: true,
  cooldown: 0
};

// ============= INPUT =============
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

// Mouse look
renderer.domElement.addEventListener('click', () => {
  if (!isTouch && document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  }
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) {
    player.yaw -= e.movementX * 0.002;
    player.pitch -= e.movementY * 0.002;
    player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
  }
});

// Keyboard actions
addEventListener('keydown', e => {
  if (e.code === 'KeyE') gather();
  if (e.code === 'KeyF') attack();
});

// Touch controls
const isTouch = 'ontouchstart' in window;
let joyId = null, lookId = null;
let joyStart = {x: 0, y: 0}, joyVec = {x: 0, y: 0};

const joyEl = document.getElementById('joy');
const joyK = document.getElementById('joyK');

renderer.domElement.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth / 2 && joyId === null) {
      joyId = t.identifier;
      joyStart = {x: t.clientX, y: t.clientY};
      joyEl.style.left = t.clientX + 'px';
      joyEl.style.top = t.clientY + 'px';
      joyEl.style.display = 'block';
    } else if (lookId === null) {
      lookId = t.identifier;
      lookId = t.identifier;
      lookStart = {x: t.clientX, y: t.clientY};
    }
  }
}, {passive: false});

let lookStart = {x: 0, y: 0};
renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      const dx = t.clientX - joyStart.x;
      const dy = t.clientY - joyStart.y;
      const d = Math.hypot(dx, dy);
      const max = 50;
      const kx = d > max ? dx / d * max : dx;
      const ky = d > max ? dy / d * max : dy;
      joyK.style.left = 'calc(50% + ' + kx + 'px)';
      joyK.style.top = 'calc(50% + ' + ky + 'px)';
      joyVec = {x: kx / max, y: ky / max};
    } else if (t.identifier === lookId) {
      player.yaw -= (t.clientX - lookStart.x) * 0.005;
      player.pitch -= (t.clientY - lookStart.y) * 0.005;
      player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
      lookStart = {x: t.clientX, y: t.clientY};
    }
  }
}, {passive: false});

renderer.domElement.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyId = null;
      joyVec = {x: 0, y: 0};
      joyEl.style.display = 'none';
      joyK.style.left = '50%';
      joyK.style.top = '50%';
    }
    if (t.identifier === lookId) lookId = null;
  }
}, {passive: false});

// Buttons
document.getElementById('btnE').onclick = gather;
document.getElementById('btnF').onclick = attack;
document.getElementById('btnJ').onclick = () => {
  if (player.onGround) player.vy = 8;
};

// ============= UI =============
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1500);
}

function updateHUD() {
  document.getElementById('hp').textContent = '❤️ ' + Math.round(player.hp);
  document.getElementById('fd').textContent = '🍖 ' + Math.round(player.food);
  document.getElementById('wt').textContent = '💧 ' + Math.round(player.water);
  document.getElementById('cWood').textContent = player.wood;
  document.getElementById('cStone').textContent = player.stone;
  document.getElementById('cBone').textContent = player.bone;
  const wepNames = {fists: 'Fists', axe: 'Axe', sword: 'Sword'};
  document.getElementById('cWep').textContent = wepNames[player.weapon] || player.weapon;
}

// ============= GATHER / ATTACK =============
const raycaster = new THREE.Raycaster();

function gather() {
  if (player.cooldown > 0) return;
  player.cooldown = 0.3;
  
  raycaster.setFromCamera({x: 0, y: 0}, camera);
  raycaster.far = 5;
  const hits = raycaster.intersectObjects(collectibles, true);
  
  if (hits.length === 0) {
    toast('Nothing nearby');
    return;
  }
  
  let obj = hits[0].object;
  while (obj && !obj.userData.type) obj = obj.parent;
  if (!obj) return;
  
  obj.userData.hp -= 1;
  
  if (obj.userData.hp <= 0) {
    const type = obj.userData.type;
    if (type === 'tree') { player.wood += 3; toast('🪵 +3 Wood'); }
    if (type === 'rock') { player.stone += 2; toast('🪨 +2 Stone'); }
    if (type === 'bone') { player.bone += 1; toast('🦴 +1 Bone'); }
    scene.remove(obj);
    const idx = collectibles.indexOf(obj);
    if (idx >= 0) collectibles.splice(idx, 1);
  } else {
    toast('Hit!');
  }
  updateHUD();
}

function attack() {
  if (player.cooldown > 0) return;
  player.cooldown = 0.5;
  
  raycaster.setFromCamera({x: 0, y: 0}, camera);
  raycaster.far = 3;
  
  const fx = -Math.sin(player.yaw);
  const fz = -Math.cos(player.yaw);
  
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = e.x - player.x;
    const dz = e.z - player.z;
    const d = Math.hypot(dx, dz);
    if (d > 3) continue;
    if ((dx * fx + dz * fz) / d < 0.3) continue;
    
    e.hp -= 40;
    toast('Hit enemy!');
    if (e.hp <= 0) {
      scene.remove(e.mesh);
      enemies.splice(i, 1);
      player.bone += 2;
      toast('💀 Enemy killed! +2 bone');
      updateHUD();
    }
    return;
  }
  toast('Nothing to hit');
}

// ============= ENEMIES =============
const enemies = [];

function spawnEnemy() {
  // Spawn near player but not too close
  const angle = Math.random() * Math.PI * 2;
  const dist = 15 + Math.random() * 10;
  const x = player.x + Math.cos(angle) * dist;
  const z = player.z + Math.sin(angle) * dist;
  
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.4, 1, 4, 6),
    new THREE.MeshLambertMaterial({color: 0x6a2a2a})
  );
  body.position.y = 1;
  g.add(body);
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 8, 6),
    new THREE.MeshLambertMaterial({color: 0x8a3a3a})
  );
  head.position.y = 1.9;
  g.add(head);
  // Glowing eyes
  const eyeMat = new THREE.MeshBasicMaterial({color: 0xff3030});
  for (const sx of [-0.12, 0.12]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), eyeMat);
    eye.position.set(sx, 2, -0.3);
    g.add(eye);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  
  enemies.push({
    mesh: g, x, z, hp: 80, speed: 3, attackCd: 0
  });
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = player.x - e.x;
    const dz = player.z - e.z;
    const d = Math.hypot(dx, dz);
    
    if (d > 60) {
      scene.remove(e.mesh);
      enemies.splice(i, 1);
      continue;
    }
    
    if (d > 1.5) {
      e.x += (dx / d) * e.speed * dt;
      e.z += (dz / d) * e.speed * dt;
    }
    
    e.mesh.position.set(e.x, 0, e.z);
    e.mesh.rotation.y = Math.atan2(dx, dz);
    
    // Attack
    e.attackCd -= dt;
    if (d < 2 && e.attackCd <= 0) {
      e.attackCd = 1.5;
      player.hp -= 8;
      toast('💥 You got hit!');
      updateHUD();
    }
  }
}

// ============= DAY / NIGHT =============
let dayTime = 0.25; // 0=night, 0.25=morning, 0.5=noon, 0.75=evening
const dayLength = 180; // seconds per full day
let dayCount = 1;

function updateDayNight(dt) {
  const prevTime = dayTime;
  dayTime += dt / dayLength;
  if (dayTime >= 1) {
    dayTime -= 1;
    dayCount++;
  }
  
  // 0.25 to 0.75 = day, 0.75 to 1.25 = night
  const isNight = dayTime < 0.2 || dayTime > 0.8;
  
  // Time display
  const hours = Math.floor(dayTime * 24);
  const mins = Math.floor((dayTime * 24 - hours) * 60);
  document.getElementById('tm').textContent = 
    (isNight ? '🌙' : '☀️') + ' Day ' + dayCount + ' ' + 
    String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0');
  
  // Sky color
  let skyColor;
  if (dayTime < 0.2) skyColor = 0x1a1a3a; // night
  else if (dayTime < 0.3) skyColor = 0xe8a060; // sunrise
  else if (dayTime < 0.7) skyColor = 0x87ceeb; // day
  else if (dayTime < 0.8) skyColor = 0xd87040; // sunset
  else skyColor = 0x1a1a3a; // night
  
  scene.background.setHex(skyColor);
  scene.fog.color.setHex(skyColor);
  
  // Light intensity
  const lightLevel = isNight ? 0.15 : 1.0;
  sun.intensity = lightLevel;
  hemi.intensity = isNight ? 0.3 : 1.2;
  
  // Spawn enemies at night
  if (isNight && !prevTime && enemies.length < 8) {
    if (Math.random() < 0.02) spawnEnemy();
  }
  
  // Remove enemies in day
  if (!isNight) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.hp -= dt * 30;
      if (e.hp <= 0) {
        scene.remove(e.mesh);
        enemies.splice(i, 1);
      }
    }
  }
  
  return isNight;
}

// ============= PLAYER UPDATE =============
const GRAVITY = 20;

function updatePlayer(dt) {
  // Movement input
  let mx = 0, mz = 0;
  if (keys['KeyW']) mz -= 1;
  if (keys['KeyS']) mz += 1;
  if (keys['KeyA']) mx -= 1;
  if (keys['KeyD']) mx += 1;
  
  mx += joyVec.x;
  mz += joyVec.y;
  
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  
  const speed = 5;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const dx = (mx * cy + mz * sy) * speed;
  const dz = (mx * -sy + mz * cy) * speed;
  
  player.x += dx * dt;
  player.z += dz * dt;
  
  // Bound
  player.x = Math.max(-95, Math.min(95, player.x));
  player.z = Math.max(-95, Math.min(95, player.z));
  
  // Gravity
  player.vy -= GRAVITY * dt;
  player.y += player.vy * dt;
  if (player.y < 1.7) {
    player.y = 1.7;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }
  
  // Survival drain
  player.food -= dt * 0.3;
  player.water -= dt * 0.4;
  if (player.food < 0) { player.food = 0; player.hp -= dt * 2; }
  if (player.water < 0) { player.water = 0; player.hp -= dt * 3; }
  if (player.cooldown > 0) player.cooldown -= dt;
  
  // Camera
  camera.position.set(player.x, player.y, player.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  
  // Update HUD less often
  if (Math.random() < 0.05) updateHUD();
  
  // Death
  if (player.hp <= 0) {
    alert('You died! Click OK to respawn');
    player.hp = 100;
    player.food = 100;
    player.water = 100;
    player.x = 0; player.z = 0;
    // Clear enemies
    for (const e of enemies) scene.remove(e.mesh);
    enemies.length = 0;
    updateHUD();
  }
}

// ============= MAIN LOOP =============
let lastTime = performance.now();
let started = false;

function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  
  if (started) {
    updatePlayer(dt);
    updateEnemies(dt);
    updateDayNight(dt);
  }
  
  renderer.render(scene, camera);
}

// ============= START =============
document.getElementById('startBtn').onclick = () => {
  document.getElementById('menu').classList.add('hide');
  started = true;
  if (!isTouch) renderer.domElement.requestPointerLock();
  updateHUD();
};

updateHUD();
loop();
</script>
</body>
</html>
